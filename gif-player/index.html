<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF Player</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2127;
    --line: #2f343d;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #4f9cff;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #d3d7de;
    --text: #1c1f24;
    --muted: #5f6875;
    --accent: #1f6fe0;
    color-scheme: light;
  }
  #theme { display: flex; padding: 7px; }
  #theme svg { width: 18px; height: 18px; }
  #theme .moon, :root[data-theme="light"] #theme .sun { display: none; }
  :root[data-theme="light"] #theme .moon { display: block; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  #fileName {
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #speedLabel { margin-left: auto; }
  #speedLabel, #zoomLabel {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    white-space: nowrap;
  }
  select {
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }

  #stage {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #stage canvas { display: block; }
  #stage.dragover { outline: 2px dashed var(--accent); outline-offset: -8px; }
  #message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    pointer-events: none;
  }

  footer {
    padding: 10px 16px 14px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  #scrub { width: 100%; margin: 0 0 8px; accent-color: var(--accent); }
  #controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .gap { width: 10px; }
  #info {
    margin-top: 8px;
    text-align: center;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  button, .file-btn {
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled), .file-btn:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #play {
    min-width: 90px;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  input[type=file] { display: none; }
</style>
</head>
<body>

<header>
  <label class="file-btn">
    Choose GIF…
    <input type="file" id="file" accept="image/gif,.gif">
  </label>
  <span id="fileName">No file selected</span>
  <label id="speedLabel">
    Speed
    <select id="speed">
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
  </label>
  <label id="zoomLabel">
    Zoom
    <select id="zoom">
      <option value="fit" selected>Fit</option>
      <option value="2">200%</option>
      <option value="1.5">150%</option>
      <option value="1.25">125%</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
      <option value="0.25">25%</option>
    </select>
  </label>
  <button id="theme" type="button" title="Switch theme" aria-label="Switch theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>

<div id="stage">
  <div id="message">Choose a .gif file, or drop one here</div>
</div>

<footer>
  <input type="range" id="scrub" min="0" max="0" value="0" step="1" disabled>
  <div id="controls">
    <button data-sec="-5" disabled>−5 s</button>
    <button data-sec="-3" disabled>−3 s</button>
    <button data-sec="-1" disabled>−1 s</button>
    <span class="gap"></span>
    <button data-frame="-1" disabled>−1 frame</button>
    <button id="play" disabled>Play</button>
    <button data-frame="1" disabled>+1 frame</button>
    <span class="gap"></span>
    <button data-sec="1" disabled>+1 s</button>
    <button data-sec="3" disabled>+3 s</button>
    <button data-sec="5" disabled>+5 s</button>
  </div>
  <div id="info">&nbsp;</div>
</footer>

<script src="vendor/pixi.min.js"></script>
<script>
// ---- Theme (saved choice, else the system preference) ----
(() => {
  const root = document.documentElement;
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch {}
  root.dataset.theme = saved ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const btn = document.getElementById('theme');
  btn.addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', root.dataset.theme); } catch {}
    btn.blur();
  });
})();

(async () => {
  const $ = (id) => document.getElementById(id);
  const stageEl = $('stage'), messageEl = $('message'), fileInput = $('file');
  const fileNameEl = $('fileName'), scrub = $('scrub'), playBtn = $('play'), infoEl = $('info');
  const buttons = document.querySelectorAll('#controls button');
  const zoomSel = $('zoom');
  const speedSel = $('speed');
  speedSel.addEventListener('change', () => speedSel.blur());

  // ---- Pixi setup ----
  const app = new PIXI.Application();
  await app.init({
    resizeTo: stageEl,
    backgroundAlpha: 0,
    antialias: true,
    autoDensity: true,
    resolution: window.devicePixelRatio || 1,
  });
  stageEl.prepend(app.canvas);

  const sprite = new PIXI.Sprite();
  sprite.anchor.set(0.5);
  sprite.visible = false;
  app.stage.addChild(sprite);

  // ---- Player state ----
  let frames = [];     // { texture, bitmap, start, duration } (times in ms)
  let total = 0;       // total duration in ms
  let time = 0;        // current playhead in ms
  let playing = false;
  let shown = -1;      // index of the frame currently displayed
  let loadId = 0;
  let panX = 0, panY = 0;   // offset from centre, in CSS px
  let pannable = false, dragging = false;

  function layout() {
    if (!frames.length) return;
    const { width, height } = app.screen;
    const pad = 16;
    const tex = frames[0].texture;
    const scale = zoomSel.value === 'fit'
      ? Math.min((width - pad * 2) / tex.width, (height - pad * 2) / tex.height)
      : Number(zoomSel.value);
    const s = Math.max(scale, 0.01);
    sprite.scale.set(s);
    // Panning is only possible on an axis where the image overflows the stage.
    const maxX = Math.max(0, (tex.width * s - width) / 2);
    const maxY = Math.max(0, (tex.height * s - height) / 2);
    panX = Math.min(Math.max(panX, -maxX), maxX);
    panY = Math.min(Math.max(panY, -maxY), maxY);
    pannable = maxX > 0 || maxY > 0;
    stageEl.style.cursor = pannable ? (dragging ? 'grabbing' : 'grab') : '';
    sprite.position.set(width / 2 + panX, height / 2 + panY);
  }
  app.renderer.on('resize', layout);
  zoomSel.addEventListener('change', () => { panX = panY = 0; layout(); zoomSel.blur(); });

  // ---- Mouse panning ----
  let lastX = 0, lastY = 0;
  stageEl.addEventListener('pointerdown', (e) => {
    if (!pannable || e.button !== 0) return;
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    stageEl.setPointerCapture(e.pointerId);
    layout();
  });
  stageEl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    panX += e.clientX - lastX;
    panY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    layout();
  });
  const endDrag = () => { if (dragging) { dragging = false; layout(); } };
  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);

  function frameAt(t) {
    let lo = 0, hi = frames.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (frames[mid].start <= t) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  const fmt = (ms) => (ms / 1000).toFixed(2) + ' s';

  function render() {
    if (!frames.length) return;
    const i = frameAt(time);
    if (i !== shown) {
      shown = i;
      sprite.texture = frames[i].texture;
      scrub.value = i;
    }
    infoEl.textContent =
      `Frame ${i + 1} / ${frames.length}  ·  ${fmt(time)} / ${fmt(total)}`;
  }

  function setPlaying(p) {
    playing = p && frames.length > 1;
    playBtn.textContent = playing ? 'Pause' : 'Play';
  }

  function seekSeconds(s) {
    time = Math.min(Math.max(time + s * 1000, 0), frames[frames.length - 1].start);
    render();
  }

  function stepFrame(d) {
    setPlaying(false);
    const n = frames.length;
    time = frames[(frameAt(time) + d + n) % n].start;
    render();
  }

  app.ticker.add((ticker) => {
    if (!playing) return;
    time = (time + ticker.deltaMS * Number(speedSel.value)) % total;
    render();
  });

  // ---- GIF loading ----
  function unload() {
    setPlaying(false);
    sprite.visible = false;
    sprite.texture = PIXI.Texture.EMPTY;
    for (const f of frames) {
      f.texture.destroy(true);
      f.bitmap.close();
    }
    frames = [];
    total = time = 0;
    shown = -1;
    panX = panY = 0;
    pannable = dragging = false;
    stageEl.style.cursor = '';
    buttons.forEach((b) => (b.disabled = true));
    scrub.disabled = true;
    infoEl.innerHTML = '&nbsp;';
  }

  function showMessage(text) {
    messageEl.textContent = text;
    messageEl.style.display = text ? '' : 'none';
  }

  async function decodeGif(file, isCurrent) {
    const decoder = new ImageDecoder({ data: await file.arrayBuffer(), type: 'image/gif' });
    await decoder.tracks.ready;
    await decoder.completed;
    const count = decoder.tracks.selectedTrack.frameCount;
    const out = [];
    let start = 0;
    try {
      for (let i = 0; i < count; i++) {
        const { image } = await decoder.decode({ frameIndex: i });
        // GIF delays of 0-10 ms are played as 100 ms by browsers; do the same.
        let duration = (image.duration || 0) / 1000;
        if (duration <= 10) duration = 100;
        const bitmap = await createImageBitmap(image);
        image.close();
        out.push({ bitmap, texture: PIXI.Texture.from(bitmap), start, duration });
        start += duration;
        if (!isCurrent()) throw new Error('cancelled');
        if (i % 10 === 0) showMessage(`Decoding… ${i + 1} / ${count}`);
      }
    } catch (err) {
      for (const f of out) { f.texture.destroy(true); f.bitmap.close(); }
      throw err;
    } finally {
      decoder.close();
    }
    return { frames: out, total: start };
  }

  async function load(file) {
    if (!file) return;
    const id = ++loadId;
    const isCurrent = () => id === loadId;
    unload();
    fileNameEl.textContent = file.name;

    if (!('ImageDecoder' in window)) {
      showMessage('This browser lacks the ImageDecoder API needed to decode GIF frames. ' +
                  'Try a recent Chrome, Edge or Firefox.');
      return;
    }
    showMessage('Decoding…');
    try {
      const result = await decodeGif(file, isCurrent);
      if (!isCurrent()) return;
      if (!result.frames.length) throw new Error('no frames found');
      frames = result.frames;
      total = result.total;
    } catch (err) {
      if (isCurrent()) showMessage('Could not read this file as a GIF (' + err.message + ').');
      return;
    }

    showMessage('');
    scrub.max = frames.length - 1;
    scrub.value = 0;
    scrub.disabled = false;
    buttons.forEach((b) => (b.disabled = false));
    sprite.visible = true;
    layout();
    render();
    setPlaying(true);
  }

  // ---- UI wiring ----
  fileInput.addEventListener('change', () => load(fileInput.files[0]));

  playBtn.addEventListener('click', () => setPlaying(!playing));
  document.querySelectorAll('[data-sec]').forEach((b) =>
    b.addEventListener('click', () => seekSeconds(Number(b.dataset.sec))));
  document.querySelectorAll('[data-frame]').forEach((b) =>
    b.addEventListener('click', () => stepFrame(Number(b.dataset.frame))));

  scrub.addEventListener('input', () => {
    setPlaying(false);
    time = frames[Number(scrub.value)].start;
    render();
  });

  stageEl.addEventListener('dragover', (e) => { e.preventDefault(); stageEl.classList.add('dragover'); });
  stageEl.addEventListener('dragleave', () => stageEl.classList.remove('dragover'));
  stageEl.addEventListener('drop', (e) => {
    e.preventDefault();
    stageEl.classList.remove('dragover');
    load(e.dataTransfer.files[0]);
  });

  // Space = play/pause, ←/→ = one frame, Shift+←/→ = one second
  window.addEventListener('keydown', (e) => {
    if (!frames.length || e.target === scrub) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
      e.preventDefault();
      const d = e.code === 'ArrowLeft' ? -1 : 1;
      e.shiftKey ? seekSeconds(d) : stepFrame(d);
    }
  });
  // Keep Space from re-triggering a focused button.
  buttons.forEach((b) => b.addEventListener('keyup', (e) => { if (e.code === 'Space') e.preventDefault(); }));
})();
</script>
</body>
</html>
